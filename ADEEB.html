<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>پنل آموزشگاه (ویژه و منحصر به فرد)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: Tahoma, sans-serif;
    direction: rtl;
    background: #f0f4f8;
    padding: 20px;
    margin: 0;
  }
  .container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.08);
  }
  .hidden { display: none !important; }
  h2 {
    color: #2980b9;
    margin: 1rem 0;
  }
  label {
    display: block;
    margin-top: 13px;
    font-weight: 600;
    color: #555;
  }
  input[type=text], input[type=password], input[type=number] {
    width: 100%;
    padding: 8px 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
    box-sizing: border-box;
  }
  input[type=file] { margin-top: 8px; }
  button {
    margin-top: 18px;
    background: linear-gradient(135deg, #2980b9, #3498db);
    color: white;
    border: none;
    padding: 12px 25px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(41, 128, 185, 0.18);
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  button:hover {
    background: linear-gradient(135deg, #3498db, #2980b9);
    transform: scale(1.07);
  }
  .logout-btn { background: #e67e22; margin-right: 10px; }
  .logout-btn:hover { background: #ca6512; }
  .clear-btn { background: #c0392b; margin-right: 10px; }
  .clear-btn:hover { background: #a93226; }
  .class-select-bar {
    margin-bottom: 14px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .class-select-bar select, .class-select-bar input[type="text"] {
    width: auto; min-width: 120px; margin-top: 0;
  }
  .class-select-bar .add-class-btn { background: #27ae60; }
  .class-select-bar .add-class-btn:hover { background: #1e8449; }
  .info-bar {
    margin: 12px 0 0 0;
    padding: 10px 0;
    background: #f7fafd;
    border-radius: 8px;
    display: flex; flex-wrap: wrap; gap: 15px;
    justify-content: flex-start;
    color: #2980b9; font-size: 15px; font-weight: 600;
  }
  .info-bar span { min-width: 120px; }
  .search-bar { margin: 20px 0 0 0; display: flex; gap: 8px; align-items: center; }
  .search-bar input[type="text"] { width: 200px; margin-top: 0; }
  table {
    width: 100%; margin-top: 12px; border-collapse: collapse; text-align: center; font-size: 14.5px;
  }
  th, td { padding: 10px 8px; border: 1px solid #ddd; vertical-align: middle; }
  th { background: #2980b9; color: white; font-weight: 700; }
  td button { padding: 6px 10px; font-size: 14px; border-radius: 10px; }
  td button.delete-btn { background: #e74c3c; }
  td button.delete-btn:hover { background: #c0392b; }
  td button.export-btn { background: #27ae60; }
  td button.export-btn:hover { background: #1e8449; }
  .pagination { margin-top: 13px; text-align: center; }
  .pagination button {
    background: #3498db; border-radius: 8px; margin: 0 5px; padding: 7px 13px;
    color: white; font-weight: 600; cursor: pointer;
    box-shadow: 0 3px 8px rgba(52, 152, 219, 0.13);
    transition: background 0.25s;
  }
  .pagination button:hover:not(.disabled) { background: #2980b9; }
  .pagination button.disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }
  .student-photo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
  .fail-grade { background: #ffe5e5 !important; color: #c0392b; }
  .pass-grade { background: #e8ffe6 !important; color: #239b56; }
  canvas { background: #fff; margin: 20px auto 0 auto; display: block; border: 1px solid #eee; border-radius: 10px; }
</style>
</head>
<body>

<!-- صفحه ورود -->
<div class="container" id="loginBox">
  <h2>ورود به پنل مدیریت</h2>
  <label for="username">نام کاربری:</label>
  <input type="text" id="username" autocomplete="off" />
  <label for="password">رمز عبور:</label>
  <input type="password" id="password" autocomplete="off" />
  <button onclick="login()">ورود</button>
</div>

<!-- صفحه پنل مدیریت -->
<div class="container hidden" id="adminPanel">
  <div class="info-bar">
    <span id="userInfo"></span>
    <span id="studentCount"></span>
    <span id="classAvg"></span>
    <span id="passCount"></span>
    <span id="failCount"></span>
    <span>
      حداقل نمره قبولی:
      <input type="number" id="passMark" style="width:50px;display:inline-block;" min="1" max="100" value="40" onchange="changePassMark()" />
    </span>
  </div>
  <button class="logout-btn" onclick="logout()">خروج</button>
  <button class="clear-btn" onclick="clearAllRecords()">پاک‌کردن همه اطلاعات</button>
  <h2>پنل مدیریت معلمان</h2>

  <!-- انتخاب و ساخت کلاس -->
  <div class="class-select-bar">
    <label for="classSelect">انتخاب صنف:</label>
    <select id="classSelect" onchange="selectClass()"></select>
    <input type="text" id="newClassName" placeholder="ساخت صنف جدید..." />
    <button class="add-class-btn" onclick="addClass()">افزودن صنف</button>
    <button class="clear-btn" onclick="removeCurrentClass()">حذف این صنف</button>
    <button onclick="exportClassToExcel()" title="خروجی اکسل">خروجی Excel</button>
  </div>

  <label for="newUsername">تغییر نام کاربری (فعلی: <span id="cuUser"></span>):</label>
  <input type="text" id="newUsername" placeholder="اگر می‌خواهید تغییر دهید" />
  <label for="newPassword">تغییر رمز عبور (فعلی: <span id="cuPass"></span>):</label>
  <input type="password" id="newPassword" placeholder="اگر می‌خواهید تغییر دهید" />
  <button onclick="updateCredentials()">ذخیره اطلاعات جدید</button>

  <hr />

  <label for="teacherName">نام معلم:</label>
  <input type="text" id="teacherName" />
  <label for="subject">مضمون:</label>
  <input type="text" id="subject" />
  <label for="examType">نوع امتحان:</label>
  <input type="text" id="examType" placeholder="مثلاً: چهارگزینه‌ای یا تشریحی" />

  <hr />

  <label for="studentName">نام متعلم:</label>
  <input type="text" id="studentName" />
  <label for="fatherName">نام پدر:</label>
  <input type="text" id="fatherName" />
  <label for="score">نمره:</label>
  <input type="number" id="score" min="0" max="100" />

  <label for="studentPhoto">عکس متعلم:</label>
  <input type="file" id="studentPhoto" accept="image/*" />

  <button id="addBtn" onclick="addRecord()">ثبت نمره</button>
  <button id="cancelEditBtn" type="button" class="hidden" onclick="cancelEdit()">لغو ویرایش</button>

  <div class="search-bar">
    <span>جستجو:</span>
    <input type="text" id="searchInput" placeholder="نام متعلم یا پدر..." oninput="renderTable()" />
  </div>

  <table id="scoreTable" aria-label="جدول نمرات">
    <thead>
      <tr>
        <th>عکس</th>
        <th>نام متعلم</th>
        <th>نام پدر</th>
        <th>معلم</th>
        <th>مضمون</th>
        <th>نوع امتحان</th>
        <th>نمره</th>
        <th>عملیات</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="pagination" id="pagination"></div>

  <h3 style="margin-top:35px;">نمودار نمرات صنف</h3>
  <canvas id="classChart" width="600" height="260"></canvas>

  <hr />

  <h3>دریافت گزارش صنف</h3>
  <button onclick="exportClassToWord()">دریافت گزارش این صنف به Word</button>
</div>

<script>
let credentials = { username: "پی", password: "پی" };
let classData = {};
let classList = [];
let currentClass = "";
const pageSize = 20;
let currentPage = 1;
let tempPhotoBase64 = "";
let editIndex = -1;
let passMark = 40;
let chartObj = null;

function saveData() {
  localStorage.setItem('schoolClassData', JSON.stringify(classData));
  localStorage.setItem('schoolClassList', JSON.stringify(classList));
  localStorage.setItem('schoolCurrentClass', currentClass);
  localStorage.setItem('schoolCredentials', JSON.stringify(credentials));
  localStorage.setItem('schoolPassMark', passMark);
}
function loadData() {
  try {
    const d = localStorage.getItem('schoolClassData');
    if (d) classData = JSON.parse(d);
    const l = localStorage.getItem('schoolClassList');
    if (l) classList = JSON.parse(l);
    const c = localStorage.getItem('schoolCredentials');
    if (c) credentials = JSON.parse(c);
    const cl = localStorage.getItem('schoolCurrentClass');
    if (cl && classList.includes(cl)) currentClass = cl;
    const pmk = localStorage.getItem('schoolPassMark');
    if (pmk) passMark = parseInt(pmk,10);
    if (!Array.isArray(classList)) classList = [];
    if (typeof classData !== "object" || !classData) classData = {};
    if (classList.length === 0) {
      classList.push("عمومی");
      classData["عمومی"] = [];
      currentClass = "عمومی";
    } else if (!currentClass) {
      currentClass = classList[0];
    }
  } catch(e) {
    classList = ["عمومی"];
    classData = {"عمومی": []};
    currentClass = "عمومی";
  }
}

loadData();

function login() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();
  if (user === credentials.username && pass === credentials.password) {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
    updateInfoBar();
    renderClassList();
    renderTable();
    renderPagination();
    renderChart();
    document.getElementById("cuUser").textContent = credentials.username;
    document.getElementById("cuPass").textContent = credentials.password;
    document.getElementById("passMark").value = passMark;
  } else {
    alert("نام کاربری یا رمز عبور اشتباه است.");
  }
}
function logout() {
  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  cancelEdit();
}
function updateCredentials() {
  const newUser = document.getElementById("newUsername").value.trim();
  const newPass = document.getElementById("newPassword").value.trim();
  if (newUser) credentials.username = newUser;
  if (newPass) credentials.password = newPass;
  saveData();
  alert("اطلاعات ورود به‌روز شد.");
  document.getElementById("cuUser").textContent = credentials.username;
  document.getElementById("cuPass").textContent = credentials.password;
  document.getElementById("newUsername").value = "";
  document.getElementById("newPassword").value = "";
}
function renderClassList() {
  const sel = document.getElementById("classSelect");
  sel.innerHTML = "";
  classList.forEach(cls => {
    const opt = document.createElement("option");
    opt.value = cls;
    opt.textContent = cls;
    if (cls === currentClass) opt.selected = true;
    sel.appendChild(opt);
  });
  if (!classList.includes(currentClass)) {
    currentClass = classList[0] || "عمومی";
  }
  saveData();
}
function addClass() {
  const val = document.getElementById("newClassName").value.trim();
  if (!val) { alert("نام صنف را وارد کنید."); return; }
  if (classList.includes(val)) { alert("این صنف وجود دارد."); return; }
  classList.push(val);
  classData[val] = [];
  currentClass = val;
  document.getElementById("newClassName").value = "";
  renderClassList();
  renderTable();
  renderPagination();
  updateInfoBar();
  renderChart();
  saveData();
}
function selectClass() {
  currentClass = document.getElementById("classSelect").value;
  currentPage = 1;
  renderTable();
  renderPagination();
  updateInfoBar();
  renderChart();
  saveData();
  cancelEdit();
}
function removeCurrentClass() {
  if (classList.length === 1) {
    alert("حداقل یک صنف باید باقی بماند!");
    return;
  }
  if (confirm("آیا مطمئن هستید که این صنف و همه متعلم‌های آن حذف شود؟")) {
    const idx = classList.indexOf(currentClass);
    classList.splice(idx, 1);
    delete classData[currentClass];
    currentClass = classList[0];
    renderClassList();
    renderTable();
    renderPagination();
    updateInfoBar();
    renderChart();
    saveData();
    cancelEdit();
  }
}

document.getElementById("studentPhoto").addEventListener("change", function(evt) {
  const file = evt.target.files[0];
  if (!file) {
    tempPhotoBase64 = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    tempPhotoBase64 = e.target.result;
  };
  reader.readAsDataURL(file);
});

function getClassData() {
  if (!classData[currentClass]) classData[currentClass] = [];
  return classData[currentClass];
}

function addRecord() {
  const student = document.getElementById("studentName").value.trim();
  const father = document.getElementById("fatherName").value.trim();
  const teacher = document.getElementById("teacherName").value.trim();
  const subject = document.getElementById("subject").value.trim();
  const examType = document.getElementById("examType").value.trim();
  const score = parseFloat(document.getElementById("score").value);

  if (!student || !father || !teacher || !subject || !examType || isNaN(score)) {
    alert("لطفاً همه فیلدها را کامل و صحیح پر کنید.");
    return;
  }
  let arr = getClassData();
  if (editIndex === -1) {
    arr.push({ student, father, teacher, subject, examType, score, photo: tempPhotoBase64 });
  } else {
    arr[editIndex] = {
      student, father, teacher, subject, examType, score,
      photo: tempPhotoBase64 || arr[editIndex].photo
    };
    editIndex = -1;
    document.getElementById("addBtn").textContent = "ثبت نمره";
    document.getElementById("cancelEditBtn").classList.add("hidden");
  }
  saveData();
  currentPage = Math.ceil(getFilteredData().length / pageSize);
  renderTable();
  renderPagination();
  updateInfoBar();
  renderChart();
  clearInputFields();
}
function editRecord(index) {
  let arr = getFilteredData();
  let globalIndex = getClassData().indexOf(arr[index]);
  if (globalIndex >= 0) {
    const item = getClassData()[globalIndex];
    document.getElementById("studentName").value = item.student;
    document.getElementById("fatherName").value = item.father;
    document.getElementById("teacherName").value = item.teacher;
    document.getElementById("subject").value = item.subject;
    document.getElementById("examType").value = item.examType;
    document.getElementById("score").value = item.score;
    tempPhotoBase64 = "";
    editIndex = globalIndex;
    document.getElementById("addBtn").textContent = "ذخیره تغییرات";
    document.getElementById("cancelEditBtn").classList.remove("hidden");
  }
}
function cancelEdit() {
  editIndex = -1;
  clearInputFields();
  document.getElementById("addBtn").textContent = "ثبت نمره";
  document.getElementById("cancelEditBtn").classList.add("hidden");
}
function clearInputFields() {
  ["studentName", "fatherName", "teacherName", "subject", "examType", "score", "studentPhoto"].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.type === "file") {
      el.value = "";
      tempPhotoBase64 = "";
    } else if (el) {
      el.value = "";
    }
  });
}
function deleteRecord(index) {
  let arr = getFilteredData();
  let globalIndex = getClassData().indexOf(arr[index]);
  if (globalIndex >= 0) {
    if (confirm("آیا مطمئن هستید که این رکورد حذف شود؟")) {
      getClassData().splice(globalIndex, 1);
      saveData();
      if (currentPage > Math.ceil(getFilteredData().length / pageSize)) currentPage--;
      renderTable();
      renderPagination();
      updateInfoBar();
      renderChart();
      cancelEdit();
    }
  }
}
function clearAllRecords() {
  if (confirm("آیا مطمئن هستید که می‌خواهید همه اطلاعات پاک شود؟")) {
    classData = {};
    classList = ["عمومی"];
    classData["عمومی"] = [];
    currentClass = "عمومی";
    saveData();
    renderClassList();
    renderTable();
    renderPagination();
    updateInfoBar();
    renderChart();
    cancelEdit();
  }
}
function getFilteredData() {
  let arr = getClassData();
  const search = (document.getElementById("searchInput") || {value:""}).value.trim();
  if (!search) return [...arr];
  return arr.filter(item =>
    item.student.includes(search) ||
    item.father.includes(search)
  );
}
function renderTable() {
  const tbody = document.querySelector("#scoreTable tbody");
  tbody.innerHTML = "";
  let filtered = getFilteredData().sort((a,b) => b.score - a.score);
  const start = (currentPage - 1) * pageSize;
  const pageData = filtered.slice(start, start + pageSize);
  pageData.forEach((item, i) => {
    const tr = document.createElement("tr");
    const passfail = (item.score >= passMark) ? "pass-grade" : "fail-grade";
    const photoCell = `<td>${item.photo ? `<img src="${item.photo}" alt="عکس متعلم" class="student-photo" />` : ""}</td>`;
    tr.innerHTML = `
      ${photoCell}
      <td>${item.student}</td>
      <td>${item.father}</td>
      <td>${item.teacher}</td>
      <td>${item.subject}</td>
      <td>${item.examType}</td>
      <td class="${passfail}">${item.score}</td>
      <td>
        <button class="delete-btn" onclick="deleteRecord(${i})" title="حذف رکورد">🗑️</button>
        <button class="export-btn" onclick="exportStudentToWord(${getFilteredData().indexOf(pageData[i]) + (currentPage-1)*pageSize})" title="گزارش Word">📄</button>
        <button onclick="editRecord(${i})" title="ویرایش متعلم">✏️</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
  if(pageData.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8">هیچ داده‌ای برای نمایش وجود ندارد.</td></tr>`;
  }
}
function renderPagination() {
  const paginationDiv = document.getElementById("pagination");
  paginationDiv.innerHTML = "";
  const filtered = getFilteredData();
  const pageCount = Math.ceil(filtered.length / pageSize);
  if(pageCount <= 1) return;

  const prevBtn = document.createElement("button");
  prevBtn.textContent = "« قبلی";
  prevBtn.disabled = currentPage === 1;
  if(prevBtn.disabled) prevBtn.classList.add("disabled");
  prevBtn.onclick = () => {
    if(currentPage > 1) {
      currentPage--;
      renderTable();
      renderPagination();
    }
  };
  paginationDiv.appendChild(prevBtn);

  let startPage = Math.max(1, currentPage - 2);
  let endPage = Math.min(pageCount, currentPage + 2);
  if (currentPage <= 2) endPage = Math.min(5, pageCount);
  if (currentPage >= pageCount - 1) startPage = Math.max(1, pageCount - 4);

  for(let i=startPage; i<=endPage; i++) {
    const pageBtn = document.createElement("button");
    pageBtn.textContent = i;
    if(i === currentPage) {
      pageBtn.classList.add("disabled");
      pageBtn.disabled = true;
    }
    pageBtn.onclick = () => {
      currentPage = i;
      renderTable();
      renderPagination();
    };
    paginationDiv.appendChild(pageBtn);
  }

  const nextBtn = document.createElement("button");
  nextBtn.textContent = "بعدی »";
  nextBtn.disabled = currentPage === pageCount;
  if(nextBtn.disabled) nextBtn.classList.add("disabled");
  nextBtn.onclick = () => {
    if(currentPage < pageCount) {
      currentPage++;
      renderTable();
      renderPagination();
    }
  };
  paginationDiv.appendChild(nextBtn);
}
function updateInfoBar() {
  let arr = getClassData();
  document.getElementById("userInfo").textContent = "کاربر فعال: " + (credentials.username || "؟");
  document.getElementById("studentCount").textContent = "تعداد متعلم‌های صنف (" + currentClass + "): " + arr.length;
  let avg = "-";
  let pass = 0, fail = 0;
  if (arr.length > 0) {
    avg = (arr.reduce((s,a)=>s+Number(a.score||0),0)/arr.length).toFixed(2);
    arr.forEach(a=>{ if(a.score>=passMark) pass++; else fail++; });
  }
  document.getElementById("classAvg").textContent = "معدل صنف: " + avg;
  document.getElementById("passCount").textContent = "قبولی: " + pass;
  document.getElementById("failCount").textContent = "مردودی: " + fail;
}
function changePassMark() {
  let newMark = parseInt(document.getElementById("passMark").value, 10);
  if (isNaN(newMark) || newMark < 1 || newMark > 100) {
    document.getElementById("passMark").value = passMark;
    alert("عدد قبولی صحیح نیست!");
    return;
  }
  passMark = newMark;
  saveData();
  renderTable();
  updateInfoBar();
  renderChart();
}
function exportStudentToWord(globalIndex) {
  let filtered = getFilteredData();
  if(globalIndex < 0 || globalIndex >= filtered.length) return alert("رکورد نامعتبر است.");
  const item = filtered[globalIndex];
  const photoHtml = item.photo ? `<img src="${item.photo}" alt="عکس متعلم" style="max-width:150px;max-height:150px;border-radius:8px;"/>` : "";
  const content = `
    <h2>گزارش نمرات متعلم</h2>
    <p><strong>نام متعلم:</strong> ${item.student}</p>
    <p><strong>نام پدر:</strong> ${item.father}</p>
    <p><strong>نام معلم:</strong> ${item.teacher}</p>
    <p><strong>مضمون:</strong> ${item.subject}</p>
    <p><strong>صنف:</strong> ${currentClass}</p>
    <p><strong>نوع امتحان:</strong> ${item.examType}</p>
    <p><strong>نمره:</strong> ${item.score}</p>
    ${photoHtml}
  `;
  downloadWordFile("student_report.doc", content);
}
function exportClassToWord() {
  let arr = getClassData();
  if(arr.length === 0) return alert("هیچ متعلمی در این صنف یافت نشد.");
  let content = `<h2>گزارش صنف ${currentClass}</h2><table border='1' cellpadding='5'><tr>
    <th>نام متعلم</th><th>نام پدر</th><th>معلم</th><th>مضمون</th><th>نوع امتحان</th><th>نمره</th></tr>`;
  arr.forEach(item => {
    content += `<tr><td>${item.student}</td><td>${item.father}</td><td>${item.teacher}</td>
    <td>${item.subject}</td><td>${item.examType}</td><td>${item.score}</td></tr>`;
  });
  content += "</table>";
  downloadWordFile("class_report.doc", content);
}
function downloadWordFile(filename, content) {
  const html = `<html><head><meta charset="utf-8"></head><body>${content}</body></html>`;
  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.click();
  URL.revokeObjectURL(url);
}
// خروجی اکسل ساده
function exportClassToExcel() {
  let arr = getClassData();
  if(arr.length === 0) return alert("هیچ متعلمی در این صنف یافت نشد.");
  let csv = "نام متعلم,نام پدر,معلم,مضمون,نوع امتحان,نمره\n";
  arr.forEach(item=>{
    csv += `"${item.student}","${item.father}","${item.teacher}","${item.subject}","${item.examType}","${item.score}"\n`;
  });
  let blob = new Blob([csv], { type: "text/csv" });
  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.href = url; a.download = `class_${currentClass}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// نمودار کلاس با Chart.js
function renderChart() {
  let arr = getClassData();
  const ctx = document.getElementById("classChart").getContext("2d");
  if(chartObj) { chartObj.destroy(); chartObj = null; }
  let labels = arr.map(a=>a.student);
  let data = arr.map(a=>a.score);
  let bgColors = arr.map(a=> a.score>=passMark ? "#2ecc71" : "#e74c3c");
  let max = arr.length>0 ? Math.max(...data) : 100;
  let min = arr.length>0 ? Math.min(...data) : 0;
  let avg = arr.length>0 ? (arr.reduce((s,a)=>s+Number(a.score||0),0)/arr.length).toFixed(2) : 0;
  chartObj = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'نمره متعلم',
        data: data,
        backgroundColor: bgColors,
      }]
    },
    options: {
      responsive: false,
      scales: {
        y: { min: 0, max: 100, title: {display:true,text:'نمره'} }
      },
      plugins: {
        title: {
          display: true,
          text: `معدل: ${avg} | بالاترین: ${max} | پایین‌ترین: ${min}`,
          font: { size: 17 }
        },
        legend: { display: false }
      }
    }
  });
}

document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("cancelEditBtn").classList.add("hidden");
  renderClassList();
  updateInfoBar();
  document.getElementById("passMark").value = passMark;
});

document.getElementById("adminPanel").classList.add("hidden");
</script>
